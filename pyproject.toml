[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "albedo"
version = "0.2.0"
description = "Flip plots between dark and light backgrounds while keeping their hues"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Arnab Lahiry", email = "alahiry@physics.uoc.gr" }]
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
pdf = ["pymupdf"]
mpl = ["matplotlib"]
all = ["pymupdf", "matplotlib"]

[project.scripts]
albedo = "albedo:main"

[tool.setuptools]
py-modules = ["albedo"]
